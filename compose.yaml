services:
  servidor1:
    build: .
    environment:
      - SERVIDOR=Servidor 1

  servidor2:
    build: .
    environment:
      - SERVIDOR=Servidor 2

  servidor3:
    build: .
    profiles: [tres]
    environment:
      - SERVIDOR=Servidor 3

  balanceador:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - servidor1
      - servidor2
